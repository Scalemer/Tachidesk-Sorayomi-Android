name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.32.5"
  PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
  KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
  KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
  KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Configure persistent release signing
        if: ${{ env.PLAY_STORE_UPLOAD_KEY != '' }}
        working-directory: android
        run: |
          printf '%s' "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          printf '%s\n' \
            'storeFile=upload-keystore.jks' \
            "keyAlias=$KEYSTORE_KEY_ALIAS" \
            "storePassword=$KEYSTORE_STORE_PASSWORD" \
            "keyPassword=$KEYSTORE_KEY_PASSWORD" \
            > key.properties

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --split-per-abi --release

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/sorayomi-android-${GITHUB_SHA::7}-all.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/sorayomi-android-${GITHUB_SHA::7}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/sorayomi-android-${GITHUB_SHA::7}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/sorayomi-android-${GITHUB_SHA::7}-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sorayomi-android-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
